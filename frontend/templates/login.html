{% extends "auth_layout.html" %}
{% block body_class %}auth login-page{% endblock %}
{% block hero_extra %}<span class="signup-welcome">KAMUSTA</span>{% endblock %}
{% block auth_form %}
<h2>Login</h2>
<h3 class="login-subtitle">Welcome Back</h3>
{% if error %}<p class="signup-error" role="alert">{{ error }}</p>{% endif %}
<form class="login-form" method="post">
  <label>
    <span>Email or username</span>
    <input type="text" name="email" placeholder="Enter your email or username" autocomplete="username" required>
  </label>
  <label>
    <span>Password</span>
    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
  </label>
  <button class="btn login-submit" type="submit">Login</button>
</form>
<p class="login-signup-prompt">Haven't created an account? <a href="{{ url_for('auth.signup') }}">Sign Up</a></p>
{% endblock %}
