<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CCSync{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}?v=30">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

  {% block scripts %}{% endblock %}
</body>
</html>
